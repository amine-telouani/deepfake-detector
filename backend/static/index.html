<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Image Detector</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 500px;
    margin: 60px auto;
    text-align: center;
  }
  #preview {
    max-width: 100%;
    max-height: 300px;
    margin-top: 20px;
    border-radius: 8px;
    display: none;
  }
  #result {
    margin-top: 20px;
    font-size: 1.3em;
    font-weight: bold;
  }
  button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 1em;
    cursor: pointer;
  }
</style>
</head>
<body>

  <h1>AI-Generated Image Detector</h1>
  <p>Upload an image to check if it's REAL or AI-GENERATED</p>

  <input type="file" id="imageInput" accept="image/*">
  <br>
  <img id="preview">
  <br>
  <button onclick="predict()">Predict</button>

  <div id="result"></div>

  <script>
    const imageInput = document.getElementById('imageInput');
    const preview = document.getElementById('preview');
    const resultDiv = document.getElementById('result');

    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = 'block';
        resultDiv.textContent = '';
      }
    });

    async function predict() {
      const file = imageInput.files[0];
      if (!file) {
        alert('Please select an image first.');
        return;
      }

      resultDiv.textContent = 'Predicting...';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const response = await fetch('/predict', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        resultDiv.textContent =
          `${data.prediction} (Fake: ${(data.fake_probability * 100).toFixed(1)}%, Real: ${(data.real_probability * 100).toFixed(1)}%)`;
      } catch (err) {
        resultDiv.textContent = 'Error: could not reach the server.';
        console.error(err);
      }
    }
  </script>

</body>
</html>
